<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABHEDYA · Sign in</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --page:#1a1a2e; --panel:#2b2d42; --mute:#8d99ae; --text:#fff; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--page); color:var(--text);
         font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:20px; }
  form { width:100%; max-width:360px; background:var(--panel); border:1px solid rgba(141,153,174,.34); border-radius:14px;
         padding:26px 24px 22px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  img { height:44px; display:block; margin:0 auto 6px; }
  h1 { font-size:20px; text-align:center; margin:4px 0 2px; letter-spacing:.06em; }
  p.sub { text-align:center; color:var(--mute); margin:0 0 18px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--mute); margin:12px 0 5px; }
  input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid rgba(141,153,174,.45); background:#1f2036;
          color:var(--text); font-size:16px; }
  input:focus { outline:2px solid #c9d1de; outline-offset:1px; }
  button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:9px; background:#fff; color:#1a1a2e;
           font-weight:700; font-size:16px; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .err { color:var(--bad); min-height:20px; font-size:14px; margin-top:10px; }
  .hint { color:var(--mute); font-size:12.5px; margin-top:14px; text-align:center; }
  .pw { position:relative; } .pw input { width:100%; padding-right:48px; }
  #eye { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:40px; height:40px; padding:0; margin:0;
         display:grid; place-items:center; background:transparent; border:0; color:var(--mute); cursor:pointer; }
  #eye[aria-pressed="true"] { color:var(--text); }
</style></head>
<body>
<form id="f" autocomplete="on">
  <img src="/viewer/abhedya_logo.png" alt="">
  <h1>ABHEDYA</h1>
  <p class="sub">Sign in to join the mission</p>
  <label for="u">User ID</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="p">Password</label>
  <div class="pw"><input id="p" name="password" type="password" autocomplete="current-password" autocapitalize="none" required>
    <button type="button" id="eye" aria-label="Show password" aria-pressed="false" title="Show password">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line id="slash" x1="3" y1="3" x2="21" y2="21" style="display:none"/></svg>
    </button></div>
  <div id="jrow"><label for="j">Join code (from the laptop's QR)</label>
    <input id="j" name="join_code" autocapitalize="characters" spellcheck="false" maxlength="6"></div>
  <button id="go">Sign in</button>
  <div class="err" id="err" role="alert"></div>
  <div class="hint">No account? Ask the commander at the demo laptop.</div>
</form>
<script>
  (function () {
    var eye = document.getElementById('eye'), p = document.getElementById('p'), slash = document.getElementById('slash');
    eye.addEventListener('click', function () {
      var show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      slash.style.display = show ? '' : 'none';
      eye.setAttribute('aria-pressed', String(show));
      eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      eye.title = eye.getAttribute('aria-label');
    });
  })();
</script>
<script src="/auth.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const next = (q.get('next') || '/viewer/').replace(/^(?!\/)/, '/');
  const m = (next.split('#')[1] || location.hash.slice(1)).match(/(?:^|&)j=([A-Z0-9]+)/i);
  if (m) { document.getElementById('j').value = m[1].toUpperCase(); document.getElementById('jrow').style.display = 'none'; }
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u.value.trim(), password: p.value, join_code: j.value.trim() }) });
      const d = await r.json();
      if (!r.ok) { err.textContent = d.detail || 'Sign-in failed.'; if (d.code === 'join_code') document.getElementById('jrow').style.display = ''; return; }
      ABHEDYA_AUTH.save(d);
      location.replace(next.split('#')[0]);
    } catch { err.textContent = 'Cannot reach the laptop. Check you are on the same Wi-Fi.'; }
    finally { btn.disabled = false; }
  });
</script>
</body></html>
